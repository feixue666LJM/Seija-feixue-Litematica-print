plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

loom {
    accessWidenerPath = file('src/main/resources/seija-printer.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Litematica is the schematic provider used by the printer; MaLiLib is its required library.
    implementation "maven.modrinth:litematica:${project.litematica_version}"
    implementation "maven.modrinth:malilib:${project.malilib_version}"
}

processResources {
    def resourceProperties = [
        version: project.version,
        minecraft_version: project.minecraft_version,
        loader_version: project.loader_version,
        fabric_api_version: project.fabric_api_version,
        litematica_version: project.litematica_version,
        malilib_version: project.malilib_version
    ]
    inputs.properties(resourceProperties)
    filesMatching('fabric.mod.json') {
        expand(resourceProperties)
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
